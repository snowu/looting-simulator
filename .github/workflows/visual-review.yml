name: Visual review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grain-visual-review
          path: |
            visual-review/
            playwright-report/
            test-results/
          retention-days: 14
